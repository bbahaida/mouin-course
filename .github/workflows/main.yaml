name: Pipeline
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - uses: actions/setup-java@v4
        name: Setup java
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        name: Setup Gradle
      - run: ./gradlew build
        name: build project